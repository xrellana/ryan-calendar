<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>工作日程</title>
  <meta name="application-name" content="工作日程">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="工作日程">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <noscript>
    <div class="gate-screen">
      <div class="gate-card">
        <h1>需要启用 JavaScript</h1>
        <p>工作日程表为纯前端本地运行工具，请在浏览器设置中启用 JavaScript 后刷新重试。</p>
      </div>
    </div>
  </noscript>

  <!-- 浏览器兼容性提示（NFR-3） -->
  <div id="compat-warning" class="gate-screen hidden" role="alert">
    <div class="gate-card">
      <h1>当前浏览器版本过低</h1>
      <p id="compat-warning-detail">当前浏览器缺少必要的现代网页特性，部分功能可能无法正常工作。</p>
      <p class="gate-hint">建议升级至 Chrome 80+、Edge 80+、Safari 16.4+ 或主流最新版手机浏览器；如在微信/内置浏览器中打开，请点击右上角选择“在默认浏览器中打开”。</p>
    </div>
  </div>

  <!-- 公网访问参数门禁提示页（FR-01） -->
  <div id="access-denied" class="gate-screen hidden" role="alert">
    <div class="gate-card">
      <div class="gate-icon" aria-hidden="true">🔒</div>
      <h1>访问受限</h1>
      <p>当前访问链接缺少有效的访问参数，无法打开工作日程表。</p>
      <p class="gate-hint">请使用包含完整访问参数的专用分享链接重新打开，或联系链接分享者获取最新地址。</p>
    </div>
  </div>

  <!-- 主应用外壳 -->
  <div id="app-shell" class="app-shell hidden">
    <!-- 顶栏（UI-1） -->
    <header class="topbar no-print">
      <div class="topbar-left">
        <div class="brand" title="工作日程">
          <span class="brand-dot" aria-hidden="true"></span>
          <span class="brand-name">工作日程</span>
        </div>
        <div class="nav-group">
          <button type="button" id="btn-prev" class="icon-btn" aria-label="上一周期" title="上一周期（左方向键）">‹</button>
          <button type="button" id="btn-today" class="btn btn-subtle btn-sm">今天</button>
          <button type="button" id="btn-next" class="icon-btn" aria-label="下一周期" title="下一周期（右方向键）">›</button>
          <h1 id="period-title" class="period-title">2026年11月</h1>
        </div>
      </div>

      <div class="topbar-right">
        <div class="view-switcher" role="tablist" aria-label="日历视图切换">
          <button type="button" class="view-tab active" data-view="month" role="tab" aria-selected="true">月</button>
          <button type="button" class="view-tab" data-view="week" role="tab" aria-selected="false">周</button>
          <button type="button" class="view-tab" data-view="year" role="tab" aria-selected="false">年</button>
        </div>

        <div class="action-group">
          <button type="button" id="btn-more" class="btn btn-outline">更多</button>
          <button type="button" id="btn-import" class="btn btn-outline">导入台账</button>
          <button type="button" id="btn-new-event" class="btn btn-primary">+ 新建日程</button>
        </div>
      </div>
    </header>

    <!-- 打印专用头部（UI-3） -->
    <div id="print-header" class="print-only print-header">
      <div class="print-title-row">
        <span class="print-app-name">工作日程表</span>
        <span id="print-period-title" class="print-period-title"></span>
        <span id="print-timestamp" class="print-timestamp"></span>
      </div>
    </div>

    <!-- 图例栏（FR-04 / FR-07 / UI-2） -->
    <section id="legend-bar" class="legend-bar" aria-label="日程类别图例"></section>

    <!-- 节假日覆盖范围提示（FR-12） -->
    <div id="year-coverage-banner" class="coverage-banner hidden no-print" role="status"></div>

    <!-- 工作区双栏布局（UI-1 / UI-2） -->
    <main class="workspace-layout">
      <section id="calendar-stage" class="calendar-stage" aria-live="polite"></section>
      <aside id="sidebar" class="sidebar no-print" aria-label="日程辅助面板"></aside>
    </main>
  </div>

  <!-- 唯一浮层容器（UI-4：同一时刻仅渲染一个弹窗或抽屉） -->
  <div id="modal-backdrop" class="modal-backdrop hidden" aria-hidden="true">
    <div id="modal-dialog" class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div>
  </div>

  <!-- 操作结果反馈 Toast（UI-4） -->
  <div id="toast-container" class="toast-container no-print" aria-live="polite"></div>

  <script defer src="js/config.js"></script>
  <script defer src="js/holidays.js"></script>
  <script defer src="js/lunar.js"></script>
  <script defer src="js/color.js"></script>
  <script defer src="js/date-utils.js"></script>
  <script defer src="js/layout.js"></script>
  <script defer src="js/storage.js"></script>
  <script defer src="js/importer.js"></script>
  <script defer src="js/views.js"></script>
  <script defer src="js/modals.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
